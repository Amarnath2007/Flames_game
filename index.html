<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAMES — Relationship Destiny Game</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Discover your relationship destiny with the classic FLAMES game. Professional aesthetic, smooth animations, and instant sharing. Find out if it's Friends, Love, Affection, Marriage, Enemies, or Siblings.">
  <meta name="keywords" content="flames game, relationship calculator, love calculator, flames destiny, online flames game">
  <meta name="author" content="FLAMES Game">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://flames-game.vercel.app/">

  <!-- OpenGraph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://flames-game.vercel.app/">
  <meta property="og:title" content="FLAMES — Relationship Destiny Game">
  <meta property="og:description" content="Discover your relationship destiny with the classic FLAMES game. Modern aesthetic, smooth animations, and instant results.">
  <meta property="og:image" content="https://flames-game.vercel.app/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://flames-game.vercel.app/">
  <meta property="twitter:title" content="FLAMES — Relationship Destiny Game">
  <meta property="twitter:description" content="Discover your relationship destiny with the classic FLAMES game.">
  <meta property="twitter:image" content="https://flames-game.vercel.app/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://flames-game.vercel.app/favicon.png">

  <!-- Performance: Preconnect & Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=DM+Sans:wght@300;400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Optimized Styles -->
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

  <!-- Optimized Background -->
  <canvas id="canvas" aria-hidden="true"></canvas>

  <!-- Main Content -->
  <main id="app">
    <header class="hero">
      <h1 class="flames-title">
        <span>F</span><span>L</span><span>A</span><span>M</span><span>E</span><span>S</span>
      </h1>
      <p class="tagline">Discover your relationship destiny</p>
    </header>

    <section class="card" aria-labelledby="card-title">
      <h2 id="card-title" class="card-heading">Enter Two Names</h2>
      
      <div class="field">
        <label for="n1">Your Name</label>
        <input type="text" id="n1" placeholder="e.g. Arjun" maxlength="40" autocomplete="off" spellcheck="false" aria-required="true">
      </div>
      
      <div class="sep" aria-hidden="true">💞</div>
      
      <div class="field">
        <label for="n2">Their Name</label>
        <input type="text" id="n2" placeholder="e.g. Priya" maxlength="40" autocomplete="off" spellcheck="false" aria-required="true">
      </div>
      
      <button class="cta" id="calcBtn" aria-label="Calculate FLAMES result">
        🔥 Reveal Your FLAMES 🔥
      </button>
      
      <div class="err" id="err" role="alert" aria-live="polite"></div>
      
      <div class="strip" aria-hidden="true">
        <div class="sl">F</div><div class="sl">L</div><div class="sl">A</div>
        <div class="sl">M</div><div class="sl">E</div><div class="sl">S</div>
      </div>
    </section>
  </main>

  <!-- Accessibility-friendly Overlays -->
  <div id="loading" role="dialog" aria-modal="true" aria-labelledby="loading-txt" aria-hidden="true">
    <div class="ring" aria-hidden="true">
      <span class="ring-icon">🔥</span>
    </div>
    <div id="loading-txt" class="load-txt">Reading your destiny…</div>
  </div>

  <div id="result" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="rw">
      <div class="r-pair" id="rPair" aria-live="polite"></div>
      
      <div class="wheel-row" id="wheelRow" role="img" aria-label="FLAMES elimination wheel">
        <div class="wl" data-l="F">F</div>
        <div class="wl" data-l="L">L</div>
        <div class="wl" data-l="A">A</div>
        <div class="wl" data-l="M">M</div>
        <div class="wl" data-l="E">E</div>
        <div class="wl" data-l="S">S</div>
      </div>
      <div class="w-cap" id="wCap" aria-live="polite"></div>

      <span class="r-emoji" id="rEmoji" aria-hidden="true"></span>
      <h2 class="r-word" id="rWord"></h2>
      <p class="r-msg" id="rMsg"></p>

      <!-- Share Card (Hidden from screen readers as it's for visual export) -->
      <div class="sc" id="sc" aria-hidden="true">
        <div class="sc-in" id="scIn">
          <div class="sc-emoji" id="scEmoji"></div>
          <div class="sc-res" id="scRes"></div>
          <div class="sc-names" id="scNamesEl"></div>
          <div class="sc-tag">FLAMES · Relationship Destiny</div>
        </div>
      </div>

      <div class="actions" id="actionsEl">
        <button class="ab wa" id="btnWa" aria-label="Share result on WhatsApp">
          💬 WhatsApp
        </button>
        <button class="ab dl" id="btnDl" aria-label="Save result as image">
          📸 Save
        </button>
        <button class="ab cp" id="btnCp" aria-label="Copy result text">
          📋 Copy
        </button>
      </div>
      
      <button class="again" id="btnAgain" aria-label="Try again with different names">
        ↩ Try Again
      </button>
    </div>
  </div>

  <!-- Accessible Toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <!-- Deferred Scripts -->
  <script src="js/particles.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
